name: Pruebas

# Corre en cada subida a main y en cada pull request. Si falla, se ve en GitHub con una X roja.
# En Railway activa "Wait for CI" (Settings → Source) para que un despliegue espere a que estas pruebas pasen.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: jalon
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_URL: mysql://root:ci-root@127.0.0.1:3306/jalon
      JWT_SECRET: secreto-solo-para-pruebas-de-ci-0123456789abcdef
      CLIENT_ORIGIN: http://localhost:5173
      SOS_ALERT_PHONES: 99990001,99990002
      # Las pruebas necesitan un superadministrador: se crea al preparar la base de datos
      ADMIN_PHONE: '90000001'
      ADMIN_PASSWORD: ci-admin-clave-larga-123
      # Sin servicios externos: la búsqueda de direcciones se omite y las rutas se estiman
      OSRM_URL: http://127.0.0.1:9
      PHOTON_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Dependencias sin vulnerabilidades graves conocidas
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix client

      - name: La web compila
        run: npm --prefix client run build

      - name: Crear la base de datos desde cero
        run: npm --prefix server run setup

      # npm test levanta su propio servidor (puerto 4500), corre todo y lo cierra
      - name: Pruebas de la API
        run: npm --prefix server test

